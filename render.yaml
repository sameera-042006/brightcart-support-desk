# Render Blueprint: one free web service, single container running both the
# MCP tool server (internal) and the FastAPI web app. Deploy with "New +" ->
# "Blueprint" in the Render dashboard, or `render blueprint launch`.
services:
  - type: web
    name: brightcart-support-desk
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: sh start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- secret: set this yourself in the Render dashboard, never commit it ---
      - key: LLM_API_KEY
        sync: false
      # --- shared token for API <-> MCP; Render generates it once ---
      - key: MCP_AUTH_TOKEN
        generateValue: true
      # --- non-secret config ---
      - key: LLM_PROVIDER
        value: gemini
      - key: MODEL_NAME
        value: gemini-3.5-flash-lite
      - key: LLM_RPM
        value: "10"
      - key: SHOP_TODAY
        value: "2026-10-31"
      - key: RATE_LIMIT_PER_MIN
        value: "10"
      - key: ALLOW_EVAL_ENDPOINT
        value: "0"
      - key: ENVIRONMENT
        value: production
