services:
  mcp-server:
    build: .
    command: ["python", "-m", "mcp_server.server"]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-dev-token}
    ports: ["8001:8001"]
  api:
    build: .
    env_file: .env
    environment:
      MCP_SERVER_URL: http://mcp-server:8001/mcp      # service name replaces localhost inside Docker
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-dev-token}
    ports: ["8000:8000"]
    depends_on: [mcp-server]
